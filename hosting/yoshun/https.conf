# Immersive Studio - managed deployment
server {
    listen 80;
    listen [::]:80;
    server_name immersive.heritagedepoudlard.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://immersive.heritagedepoudlard.fr$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name immersive.heritagedepoudlard.fr;
    root /var/www/immersive-studio/current;

    ssl_certificate /etc/letsencrypt/live/immersive.heritagedepoudlard.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immersive.heritagedepoudlard.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/immersive-studio-access.log;
    error_log /var/log/nginx/immersive-studio-error.log warn;

    include /etc/nginx/snippets/immersive-studio-static.conf;
}

