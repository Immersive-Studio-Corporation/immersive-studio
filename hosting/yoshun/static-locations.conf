# Immersive Studio - managed deployment
index index.html;
charset utf-8;
autoindex off;
server_tokens off;
expires -1;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

location = /index.html {
    expires -1;
}

# These filenames include a content hash. Images have stable names instead.
location ^~ /_next/static/ {
    expires 1y;
    try_files $uri =404;
}

location ^~ /images/ {
    expires 1h;
    try_files $uri =404;
}

location = /index.rsc {
    default_type text/x-component;
    try_files $uri =404;
}

location ~ /\. {
    deny all;
}

location / {
    try_files $uri $uri/ =404;
}

error_page 404 /404.html;
