name: immersive-studio
services:
  web:
    image: nginx@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    container_name: immersive-studio-web
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx-container.conf:/etc/nginx/nginx.conf:ro
      - ./static-locations.conf:/etc/nginx/immersive-static.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=8m,uid=101,gid=101
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

